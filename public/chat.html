<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Man Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <div class="avatar">O</div>
                <div class="header-titles">
                    <h2>Omni-Man</h2>
                    <span>Viltrumita</span>
                </div>
            </div>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="mensagem bot">
                O que você quer da terra de Viltrum? Fale rápido, meu tempo é valioso demais para ser desperdiçado com seres inferiores.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Digite sua mensagem para Omni-Man..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script>
        let historico = [];

        const chatBox = document.getElementById('chat-messages');
        const inputMensagem = document.getElementById('user-input');
        const btnEnviar = document.getElementById('send-btn');

        function adicionarMensagem(texto, remetente, isDigitando = false) {
            const div = document.createElement('div');
            div.classList.add('mensagem', remetente);
            if (isDigitando) div.classList.add('digitando');
            div.textContent = texto;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function enviarMensagem() {
            const texto = inputMensagem.value.trim();
            if (!texto) return;

            adicionarMensagem(texto, 'user');
            inputMensagem.value = '';
            inputMensagem.disabled = true;
            btnEnviar.disabled = true;

            historico.push({ role: "user", content: texto });

            const indicadorDigitando = adicionarMensagem("Omni-Man está analisando sua insignificância...", 'bot', true);

            try {
                const resposta = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ historico })
                });

                const dados = await resposta.json();
                chatBox.removeChild(indicadorDigitando);

                if (resposta.ok && dados.resposta) {
                    adicionarMensagem(dados.resposta, 'bot');
                    historico.push({ role: "assistant", content: dados.resposta });
                } else {
                    adicionarMensagem("Erro na transmissão: " + (dados.erro || "Resposta inválida do servidor."), 'bot');
                }

            } catch (erro) {
                chatBox.removeChild(indicadorDigitando);
                adicionarMensagem("Falha de comunicação. Verifique se o server.js está rodando na porta 3001.", 'bot');
                console.error("Erro no fetch:", erro);
            } finally {
                inputMensagem.disabled = false;
                btnEnviar.disabled = false;
                inputMensagem.focus();
            }
        }

        function sair() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }

        btnEnviar.addEventListener('click', enviarMensagem);

        inputMensagem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });
    </script>

</body>
</html>
